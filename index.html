<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조우정 포트폴리오</title>
  <style>
    :root {
      --navy-dark: #0a1931;
      --navy: #13294b;
      --navy-light: #1f3c6e;
      --accent: #c9d6ea;
      --text: #f4f7fb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-light) 100%);
      color: var(--text);
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .divider {
      width: 60px;
      height: 3px;
      margin: 0 auto 24px;
      background: var(--accent);
      border-radius: 2px;
    }

    p {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--accent);
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid rgba(201, 214, 234, 0.4);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>조우정 포트폴리오</h1>
    <div class="divider"></div>
    <p>바이브 수업 내용</p>
  </main>
</body>
</html>
